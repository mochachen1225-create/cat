<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>陪我一生的貓</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow storybook column — a lit room (the stage) above a wooden toy-shelf of controls, set on a night-ink page. */
:root{
  --ink:#1E2638;        /* page night */
  --ink-2:#2A3450;      /* raised panels */
  --paper:#F4EFE4;      /* text on ink, letter paper */
  --wall:#DDE6DE;       /* room wall, pale sage */
  --wood:#C7965F;       /* floor */
  --wood-dk:#A57843;
  --eye:#F2B53B;        /* accent: cat-eye amber */
  --blush:#F08DA2;      /* hearts */
  --muted:#9AA5BE;
  --danger:#E7756A;
  --ok:#8CC98A;
  --display:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;
  background-image:radial-gradient(1px 1px at 20% 30%,#ffffff55 50%,transparent 51%),radial-gradient(1px 1px at 70% 10%,#ffffff44 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 60%,#ffffff33 50%,transparent 51%),radial-gradient(1px 1px at 40% 80%,#ffffff33 50%,transparent 51%);
  background-size:220px 220px;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;
  padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.disp{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--eye);outline-offset:2px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;flex-wrap:wrap}
.top h1{font-size:28px;line-height:1.1}
.top .sub{color:var(--muted);font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--ink-2);color:var(--paper);letter-spacing:.05em}
.chip.amber{background:var(--eye);color:var(--ink);font-weight:700}

/* room stage */
.room{position:relative;width:100%;aspect-ratio:1/0.86;border-radius:22px;overflow:hidden;background:var(--wall);
  box-shadow:0 0 0 6px var(--ink-2),0 18px 40px #0008;user-select:none}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:30%;
  background:repeating-linear-gradient(90deg,var(--wood) 0 58px,var(--wood-dk) 58px 60px);box-shadow:inset 0 6px 0 #0000001a}
.room .win{position:absolute;left:8%;top:9%;width:30%;aspect-ratio:1/1.1;border-radius:46% 46% 8px 8px;border:7px solid #fff;
  box-shadow:0 0 0 2px #0001;overflow:hidden;transition:background 1s}
.room .win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:#fff}
.room .orb{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;right:16%;top:20%;transition:all 1s}
.room .frame{position:absolute;right:9%;top:12%;width:19%;aspect-ratio:1.2;background:#fff;border-radius:6px;padding:6px;transform:rotate(3deg);box-shadow:0 3px 8px #0002}
.room .frame div{width:100%;height:100%;border-radius:3px;background:linear-gradient(#9fc6d9 0 55%,#8eb070 55%)}
.room .rug{position:absolute;left:50%;bottom:6%;width:62%;height:15%;transform:translateX(-50%);border-radius:50%;
  background:repeating-radial-gradient(ellipse at center,#E9A8A0 0 10px,#F3C7B8 10px 20px);opacity:.9}
.room .dim{position:absolute;inset:0;background:#0B1030;opacity:0;pointer-events:none;transition:opacity 1s}
.room.t2 .dim{opacity:.38}
.room.t3 .dim{opacity:.62}
.room.t0 .win{background:linear-gradient(#9fd5f2,#d9f0fa)} .room.t0 .orb{background:#FFE89A;box-shadow:0 0 18px #FFE89A}
.room.t1 .win{background:linear-gradient(#f6c879,#fbe4b2)} .room.t1 .orb{background:#FFD36B;top:40%}
.room.t2 .win,.room.t3 .win{background:linear-gradient(#141a3d,#2d3870)} .room.t2 .orb,.room.t3 .orb{background:#F4F1D0;box-shadow:inset -8px -2px 0 #c9c59a;width:20%}

.catwrap{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);cursor:pointer;transition:width .8s;touch-action:manipulation;z-index:2}
.catwrap.kitten{width:36%}.catwrap.adult{width:48%}.catwrap.senior{width:48%}
.catwrap svg{display:block;width:100%;height:auto;overflow:visible}
.catwrap .bob{transform-origin:50% 100%;animation:breath 3.2s ease-in-out infinite}
.catwrap.senior .bob{animation-duration:4.4s}
.catwrap.hop .bob{animation:hop .5s ease-out 2}
.catwrap.wiggle .bob{animation:wiggle .35s ease-in-out 3}
.catwrap.shrink .bob{animation:shrink .6s ease-in-out}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%) scale(.96,1.05)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes shrink{0%,100%{transform:scale(1)}40%{transform:scale(1.06,.9)}}
.tail{animation:tail 2.4s ease-in-out infinite;transform-box:view-box}
.sleepy .tail{animation-duration:6s}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.eye{animation:blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

/* photo cat */
.photocat{position:relative;width:100%;aspect-ratio:1/1.08}
.photocat .ears{position:absolute;inset:0}
.photocat .pic{position:absolute;left:6%;right:6%;bottom:0;aspect-ratio:1;border-radius:50%;background-size:cover;background-position:center;
  border:5px solid #fff;box-shadow:0 6px 14px #0003}
.photocat.senior .pic{filter:saturate(.75) sepia(.15)}
.photocat .face{position:absolute;inset:0;pointer-events:none}

.bubble{position:absolute;left:50%;top:5%;transform:translateX(-50%);max-width:78%;background:#fff;color:#2b2b33;font-family:var(--display);
  font-size:16px;line-height:1.45;padding:8px 14px;border-radius:16px;text-align:center;box-shadow:0 4px 12px #0002;z-index:4;transition:opacity .3s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble:empty{opacity:0}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.float{position:absolute;font-size:22px;animation:floatup 1.4s ease-out forwards;font-family:var(--display);font-weight:700;color:var(--blush);white-space:nowrap}
@keyframes floatup{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-8px) scale(1)}100%{opacity:0;transform:translateY(-90px) scale(1.1)}}
.zzz{position:absolute;font-family:var(--display);font-size:20px;color:#fff;animation:zzz 2.6s linear infinite;opacity:0}
@keyframes zzz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(20px,-50px)}}

.narr{min-height:44px;font-family:var(--display);font-size:16px;line-height:1.6;color:var(--paper);padding:0 4px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:5px;min-width:0}
.stat .lab{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.stat .bar{height:8px;border-radius:99px;background:#ffffff14;overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:99px;background:var(--eye);transition:width .6s}
.stat.low .bar i{background:var(--danger)}
.stat.bond .bar i{background:var(--blush)}

/* actions */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{background:var(--ink-2);border:0;border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:inset 0 -3px 0 #0003;transition:transform .1s}
.act:active{transform:translateY(2px)}
.act .ic{font-size:22px;line-height:1.2}
.act .t{font-size:14px;font-weight:500}
.act .d{font-size:11px;color:var(--muted)}
.act:disabled{opacity:.4;cursor:default}
.act.primary{background:var(--eye);color:var(--ink)} .act.primary .d{color:#1e263899}
.links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}

/* intro */
.street{background:linear-gradient(#5a6680,#7d879a)}
.street .floor{background:#4d5466;height:24%}
.rain{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(105deg,transparent 48%,#ffffff40 49%,#ffffff40 51%,transparent 52%);
  background-size:26px 60px;animation:rain .45s linear infinite;opacity:.8}
@keyframes rain{to{background-position:-12px 60px}}
.box{position:absolute;left:50%;bottom:10%;width:52%;transform:translateX(-50%);z-index:3;pointer-events:none}
.box .front{position:relative;height:0;padding-bottom:46%;background:#C39058;border-radius:4px;box-shadow:inset 0 -10px 0 #0001}
.box .front span{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--display);color:#5a3d1e;font-size:clamp(12px,3.4vw,17px)}
.box .flap{position:absolute;top:-16%;width:52%;height:22%;background:#B07D46;border-radius:3px}
.box .flap.l{left:-6%;transform:rotate(-14deg)}.box .flap.r{right:-6%;transform:rotate(14deg)}
.peek{position:absolute;left:50%;bottom:22%;width:30%;transform:translateX(-50%);z-index:2;transition:bottom .8s}
.peek.up{bottom:26%}
.panel{display:flex;flex-direction:column;gap:12px}
.panel p{margin:0;font-family:var(--display);font-size:17px;line-height:1.75}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 18px;background:var(--ink-2);font-weight:500;box-shadow:inset 0 -3px 0 #0003}
.btn.primary{background:var(--eye);color:var(--ink);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input[type=text]{font:inherit;font-size:18px;font-family:var(--display);padding:10px 12px;border-radius:12px;border:2px solid var(--ink-2);background:#ffffff0d;color:var(--paper)}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.sugs button{border:1px solid #ffffff22;background:none;border-radius:99px;padding:4px 12px;font-size:13px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--ink-2);background:none;border-radius:12px;padding:8px}
.seg button[aria-pressed=true]{border-color:var(--eye);color:var(--eye)}
.upload{display:flex;align-items:center;gap:12px;padding:12px;border:2px dashed #ffffff26;border-radius:14px}
.upload .thumb{width:56px;height:56px;border-radius:50%;background:#ffffff10 center/cover;flex:none;display:grid;place-items:center;font-size:22px}
.upload .txt{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.5}
.upload .txt b{color:var(--paper);font-weight:500;display:block;font-size:14px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* modal */
.modal{position:fixed;inset:0;background:#0b1020b3;display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .25s}
@keyframes fade{from{opacity:0}}
.card{background:var(--paper);color:#2a2a33;border-radius:20px;padding:20px;max-width:420px;width:100%;max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 20px 50px #0008;animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.9)}}
.card .kicker{font-size:12px;letter-spacing:.12em;color:#8a7f6d}
.card h2{font-size:24px}
.card p{margin:0;white-space:pre-line;font-family:var(--display);font-size:17px;line-height:1.7}
.card .opts{display:flex;flex-direction:column;gap:8px}
.card .opt{text-align:left;border:0;border-radius:12px;padding:12px 14px;background:#2a2a330d;color:#2a2a33;font-size:15px;box-shadow:inset 0 -2px 0 #0001}
.card .opt:hover{background:#2a2a331a}
.card .opt small{display:block;color:#7b7468;font-size:12px;margin-top:2px}
.card .res{background:#F2B53B2e;border-radius:12px;padding:10px 12px}
.mem{display:grid;grid-template-columns:76px 1fr;gap:4px 12px;font-size:14px;line-height:1.6}
.mem .a{color:#8a7f6d;font-variant-numeric:tabular-nums}
.mem .x{font-family:var(--display);font-size:15px}

/* ending */
.sky{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:1/0.75;background:radial-gradient(ellipse at 50% 120%,#3b4a7a,#141a33 70%)}
.sky .stars{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 60%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 80% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 60% 15%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90% 70%,#fff 50%,transparent 51%);background-size:160px 160px;animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.5}}
.sky .bow{position:absolute;left:50%;bottom:-62%;width:120%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,transparent 52%,#e7756a55 52% 55%,#f2b53b55 55% 58%,#8cc98a55 58% 61%,#7fb7e655 61% 64%,#b49ae055 64% 67%,transparent 67%)}
.sky .soul{position:absolute;left:50%;bottom:24%;width:34%;transform:translateX(-50%);animation:drift 5s ease-in-out infinite;opacity:.95}
@keyframes drift{50%{transform:translate(-50%,-6%)}}
.letter{background:var(--paper);color:#2f2a26;border-radius:6px 6px 18px 18px;padding:22px 20px;font-family:var(--display);font-size:17px;line-height:1.95;white-space:pre-wrap;
  background-image:repeating-linear-gradient(transparent 0 32px,#c9bfae55 32px 33px);background-position:0 18px;box-shadow:0 12px 30px #0006;min-height:200px}
.letter .cur{display:inline-block;width:2px;height:1em;background:#2f2a26;vertical-align:-2px;animation:blinkc 1s step-end infinite}
@keyframes blinkc{50%{opacity:0}}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.summary div{background:var(--ink-2);border-radius:12px;padding:10px 4px}
.summary b{display:block;font-family:var(--display);font-size:22px;color:var(--eye);font-variant-numeric:tabular-nums}
.summary span{font-size:11px;color:var(--muted)}
.fadeout{animation:fadeout 2.2s forwards}
@keyframes fadeout{to{opacity:0;filter:blur(4px)}}

@media (max-width:420px){.stats{grid-template-columns:repeat(5,1fr);gap:6px}.stat .lab{font-size:11px}.top h1{font-size:24px}.summary{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<div id="app"></div>
<div id="modalRoot"></div>
<input type="file" id="photoInput" accept="image/*" class="visually-hidden" tabindex="-1">

<script>
(() => {
'use strict';
/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const KEY = 'cat-life-v1';

/* ---------- coats ---------- */
const WHITE = '#FBF8F3';
const COATS = [
  {id:'orange',  name:'橘貓',   base:'#EDA65E', stripe:'#CB7A33', tabby:true, eye:'#A6C85A', nose:'#E98A8A', names:['小橘','肉鬆','地瓜','南瓜']},
  {id:'ow',      name:'橘白貓', base:'#EFAB68', stripe:'#D3843F', tabby:true, white:['muzzle','chest','paws'], eye:'#EDBB3A', nose:'#F09A9A', names:['奶茶','布丁','起司']},
  {id:'black',   name:'黑貓',   base:'#2C2A33', eye:'#F4C430', nose:'#6A5560', names:['煤球','芝麻','黑糖','Luna']},
  {id:'white',   name:'白貓',   base:'#FAF7F1', eye:'#86BEEA', eye2:'#EDC33F', nose:'#F4A3AC', names:['麻糬','湯圓','雪球']},
  {id:'grey',    name:'藍貓',   base:'#8E98A6', eye:'#EAA93C', nose:'#82707C', names:['灰灰','鐵蛋','霧霧']},
  {id:'tabby',   name:'虎斑貓', base:'#A9896A', stripe:'#4E3C2C', tabby:true, white:['muzzle'], eye:'#B9C64B', nose:'#D88A80', names:['虎虎','咖啡','栗子']},
  {id:'calico',  name:'三花貓', base:'#FAF6EE', patches:['#E59B50','#33302F'], eye:'#DDAA36', nose:'#F2A0A6', names:['花花','三三','豆花']},
  {id:'tuxedo',  name:'賓士貓', base:'#28262D', white:['muzzle','chest','paws'], eye:'#A0C760', nose:'#F2A3AB', names:['賓賓','黑白','乳牛']},
  {id:'siamese', name:'暹羅貓', base:'#F0E5D3', points:'#5D4538', eye:'#72AEE6', nose:'#5D4538', names:['可可','焦糖','拿鐵']},
  {id:'tortie',  name:'玳瑁貓', base:'#3C2D27', patches:['#CD7B3D','#9A6238'], eye:'#E3AB3C', nose:'#6E4E46', names:['玳玳','焦焦','黑糖糕']},
  {id:'gw',      name:'灰白貓', base:'#9299A4', white:['muzzle','chest','paws','belly'], eye:'#E6B53E', nose:'#F0A0A8', names:['小灰','米米','阿飄']},
];
const COAT = Object.fromEntries(COATS.map(c => [c.id, c]));
const lum = hex => {const n=parseInt(hex.slice(1),16);return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255};
const darken = (hex, f) => {const n=parseInt(hex.slice(1),16);const r=Math.round((n>>16)*f),g=Math.round((n>>8&255)*f),b=Math.round((n&255)*f);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)};

/* ---------- drawing ---------- */
function geom(stage){
  if(stage==='kitten') return {H:{cx:100,cy:116,rx:44,ry:38},B:{cx:100,cy:170,rx:31,ry:30},eyeR:11,tailK:.7};
  if(stage==='senior') return {H:{cx:100,cy:96,rx:41,ry:35},B:{cx:100,cy:153,rx:48,ry:46},eyeR:9,tailK:1};
  return {H:{cx:100,cy:92,rx:41,ry:35},B:{cx:100,cy:152,rx:45,ry:47},eyeR:9.5,tailK:1};
}
let uidN = 0;
function catSVG(coatId, seed, stage, expr, ageM){
  const c = COAT[coatId], rnd = mulberry32(seed||1), G = geom(stage), {H,B} = G, id = 'k'+(++uidN);
  const cx = H.cx, line = darken(c.base, lum(c.base)<.3 ? 1 : .55);
  const ol = lum(c.base) < .3 ? '#00000055' : darken(c.base,.78);
  const earL = [[cx-H.rx*.95,H.cy-H.ry*.2],[cx-H.rx*.8,H.cy-H.ry*1.42],[cx-H.rx*.2,H.cy-H.ry*.86]];
  const earR = earL.map(([x,y])=>[2*cx-x,y]);
  const shrink = (pts,k) => {const mx=(pts[0][0]+pts[1][0]+pts[2][0])/3,my=(pts[0][1]+pts[1][1]+pts[2][1])/3;return pts.map(([x,y])=>[mx+(x-mx)*k,my+(y-my)*k+3])};
  const poly = p => p.map(q=>q.join(',')).join(' ');
  const pawY = B.cy+B.ry-5, paws = [[cx-16,pawY],[cx+16,pawY]];
  const pawEl = (fill,s='') => paws.map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="12" ry="8" fill="${fill}" ${s}/>`).join('');
  const sil = `<polygon points="${poly(earL)}"/><polygon points="${poly(earR)}"/><ellipse cx="${B.cx}" cy="${B.cy}" rx="${B.rx}" ry="${B.ry}"/><ellipse cx="${cx}" cy="${H.cy}" rx="${H.rx}" ry="${H.ry}"/>${pawEl('#000')}`;
  // tail
  const sx = B.cx+B.rx*.55, sy = B.cy+B.ry*.72, k = G.tailK;
  const tailD = `M${sx},${sy} C${sx+38*k},${sy+6} ${sx+54*k},${sy-26*k} ${sx+40*k},${sy-64*k}`;
  let tail = `<path d="${tailD}" stroke="${ol}" stroke-width="17" fill="none" stroke-linecap="round"/><path d="${tailD}" stroke="${c.base}" stroke-width="14" fill="none" stroke-linecap="round"/>`;
  if(c.tabby) tail += `<path d="${tailD}" stroke="${c.stripe}" stroke-width="14" fill="none" stroke-dasharray="7 8"/>`;
  if(c.points) tail += `<path d="${tailD}" stroke="${c.points}" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="0 34 200" opacity=".9"/>`;
  if(c.patches) tail += `<path d="${tailD}" stroke="${c.patches[0]}" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="22 14"/>`;
  // overlays (clipped to silhouette)
  let ov = '';
  const W = c.white || [];
  if(W.includes('belly')) ov += `<ellipse cx="${cx}" cy="${B.cy+B.ry*.2}" rx="${B.rx*.62}" ry="${B.ry*.72}" fill="${WHITE}"/>`;
  if(W.includes('chest')) ov += `<ellipse cx="${cx}" cy="${B.cy-B.ry*.2}" rx="${B.rx*.42}" ry="${B.ry*.62}" fill="${WHITE}"/>`;
  if(c.tabby){
    for(let i=-1;i<=1;i++) ov += `<path d="M${cx+i*9},${H.cy-H.ry*.98} L${cx+i*7},${H.cy-H.ry*.55}" stroke="${c.stripe}" stroke-width="4.5" stroke-linecap="round"/>`;
    for(const s of [-1,1]) for(let j=0;j<2;j++) ov += `<path d="M${cx+s*H.rx*1.02},${H.cy+j*9} L${cx+s*H.rx*.68},${H.cy+H.ry*.12+j*9}" stroke="${c.stripe}" stroke-width="4" stroke-linecap="round"/>`;
    for(const s of [-1,1]) for(let j=0;j<4;j++){const y=B.cy-B.ry*.45+j*15;ov += `<path d="M${cx+s*(B.rx+3)},${y} Q${cx+s*B.rx*.62},${y+8} ${cx+s*B.rx*.42},${y-4}" stroke="${c.stripe}" stroke-width="6" fill="none" stroke-linecap="round"/>`;}
  }
  if(c.patches){
    const n = 4 + Math.floor(rnd()*2);
    for(let i=0;i<n;i++){
      const onHead = i < 2;
      const x = onHead ? cx + (rnd()*2-1)*H.rx*.8 : B.cx + (rnd()*2-1)*B.rx*.85;
      const y = onHead ? H.cy - H.ry*.35 + (rnd()*2-1)*H.ry*.4 : B.cy + (rnd()*2-1)*B.ry*.6;
      const r = onHead ? 14 + rnd()*10 : 17 + rnd()*13;
      ov += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${r.toFixed(1)}" ry="${(r*(.7+rnd()*.5)).toFixed(1)}" transform="rotate(${Math.round(rnd()*80-40)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${c.patches[i%c.patches.length]}"/>`;
    }
  }
  if(W.includes('muzzle')) ov += `<ellipse cx="${cx}" cy="${H.cy+H.ry*.5}" rx="${H.rx*.56}" ry="${H.ry*.45}" fill="${WHITE}"/>` + (c.id==='tuxedo'?`<path d="M${cx-6},${H.cy+H.ry*.2} L${cx},${H.cy-H.ry*.5} L${cx+6},${H.cy+H.ry*.2}Z" fill="${WHITE}"/>`:'');
  if(W.includes('paws')) ov += pawEl(WHITE);
  let pts = '';
  if(c.points) pts = `<g filter="url(#${id}b)"><ellipse cx="${cx}" cy="${H.cy+H.ry*.38}" rx="${H.rx*.52}" ry="${H.ry*.55}" fill="${c.points}"/><polygon points="${poly(earL)}" fill="${c.points}"/><polygon points="${poly(earR)}" fill="${c.points}"/>${pawEl(c.points)}<ellipse cx="${cx}" cy="${B.cy+B.ry}" rx="${B.rx}" ry="14" fill="${c.points}" opacity=".5"/></g>`;
  const grey = ageM >= 132 ? `<ellipse cx="${cx}" cy="${H.cy+H.ry*.45}" rx="${H.rx*.6}" ry="${H.ry*.45}" fill="#fff" opacity=".35" filter="url(#${id}b)"/>` : '';
  // face colours
  const faceBase = W.includes('muzzle') ? WHITE : c.base;
  const darkFace = c.points ? true : lum(faceBase) < .3;
  const fl = darkFace ? '#EDE6DA' : '#3B302B';
  const innerEar = lum(c.base) < .3 ? '#B87F8A' : '#F2B3B8';
  // eyes
  const ey = H.cy + H.ry*.06, ex = H.rx*.42, r = G.eyeR;
  const eyeCol = [c.eye, c.eye2 || c.eye];
  const eyes = [-1,1].map((s,i) => {
    const x = cx + s*ex;
    if(expr==='happy') return `<path d="M${x-r},${ey+3} Q${x},${ey-r*1.1} ${x+r},${ey+3}" stroke="${fl}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
    if(expr==='sleep') return `<path d="M${x-r},${ey} Q${x},${ey+r*.9} ${x+r},${ey}" stroke="${fl}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
    if(expr==='angry') return `<path d="M${x-s*r*.8},${ey-r*.6} L${x+s*r*.6},${ey} L${x-s*r*.8},${ey+r*.6}" stroke="${fl}" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    const ry = stage==='senior' ? r*.82 : r*1.05;
    const sad = expr==='sad' ? `<path d="M${x-r*1.1},${ey-r*1.3+(s<0?-3:3)} L${x+r*1.1},${ey-r*1.3+(s<0?3:-3)}" stroke="${fl}" stroke-width="2.5" stroke-linecap="round"/>` : '';
    return `<g class="eye"><ellipse cx="${x}" cy="${ey}" rx="${r}" ry="${ry}" fill="${eyeCol[i]}" stroke="${darkFace?'#00000066':fl}" stroke-width="1.6"/><ellipse cx="${x}" cy="${ey}" rx="${r*.42}" ry="${ry*.86}" fill="#16141a"/><circle cx="${x-r*.32}" cy="${ey-ry*.38}" r="${r*.3}" fill="#fff"/><circle cx="${x+r*.3}" cy="${ey+ry*.3}" r="${r*.13}" fill="#fff"/></g>${sad}`;
  }).join('');
  const ny = H.cy + H.ry*.4;
  const nose = `<path d="M${cx-5},${ny-3} L${cx+5},${ny-3} L${cx},${ny+3}Z" fill="${c.nose}" stroke="${c.nose}" stroke-width="2.5" stroke-linejoin="round"/>`;
  const mouth = expr==='angry'
    ? `<path d="M${cx},${ny+3} L${cx},${ny+6} M${cx-7},${ny+11} Q${cx},${ny+4} ${cx+7},${ny+11}" stroke="${fl}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`
    : `<path d="M${cx},${ny+3} L${cx},${ny+6} M${cx-8},${ny+7} Q${cx-4},${ny+12} ${cx},${ny+6} Q${cx+4},${ny+12} ${cx+8},${ny+7}" stroke="${fl}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  const wc = darkFace ? '#ffffffaa' : '#00000055';
  const whisk = [-1,1].map(s => [-6,0,6].map(d => `<path d="M${cx+s*H.rx*.42},${ny+2+d*.4} L${cx+s*H.rx*1.25},${ny-4+d*1.5}" stroke="${wc}" stroke-width="1.3" stroke-linecap="round"/>`).join('')).join('');
  const blush = [-1,1].map(s => `<ellipse cx="${cx+s*H.rx*.62}" cy="${ny+3}" rx="7.5" ry="4.5" fill="#F48FA4" opacity="${expr==='happy'?.6:.35}"/>`).join('');
  return `<svg viewBox="0 -10 220 215" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs><clipPath id="${id}c">${sil}</clipPath><filter id="${id}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>
<ellipse cx="100" cy="${pawY+6}" rx="${B.rx+14}" ry="7" fill="#0000001f"/>
<g class="bob ${expr==='sleep'?'sleepy':''}">
<g class="tail" style="transform-origin:${sx}px ${sy}px">${tail}</g>
<g fill="${c.base}" stroke="${ol}" stroke-width="2.5" stroke-linejoin="round">
<polygon points="${poly(earL)}"/><polygon points="${poly(earR)}"/>
<ellipse cx="${B.cx}" cy="${B.cy}" rx="${B.rx}" ry="${B.ry}"/>${pawEl(c.base)}
<ellipse cx="${cx}" cy="${H.cy}" rx="${H.rx}" ry="${H.ry}"/></g>
<g clip-path="url(#${id}c)">${ov}${pts}${grey}</g>
<g fill="none" stroke="${ol}" stroke-width="2"><ellipse cx="${cx}" cy="${H.cy}" rx="${H.rx}" ry="${H.ry}"/>${paws.map(([x,y])=>`<path d="M${x-4},${y+2} v4 M${x+4},${y+2} v4"/>`).join('')}</g>
<polygon points="${poly(shrink(earL,.5))}" fill="${innerEar}" opacity=".85"/><polygon points="${poly(shrink(earR,.5))}" fill="${innerEar}" opacity=".85"/>
${blush}${eyes}${nose}${mouth}${whisk}
</g></svg>`;
}
// photo version: user's own photo in an ear-topped frame, with drawn expression marks
function photoCat(photo, stage, expr){
  const marks = expr==='happy' ? '<text x="168" y="40" font-size="26">💕</text>'
    : expr==='sleep' ? '<text x="165" y="42" font-size="22" fill="#fff" font-family="serif">z z</text>'
    : expr==='angry' ? '<text x="160" y="42" font-size="26">💢</text>'
    : expr==='sad' ? '<text x="160" y="42" font-size="24">💧</text>' : '';
  return `<div class="photocat ${stage}"><svg class="ears" viewBox="0 0 200 216" aria-hidden="true">
<polygon points="34,86 30,8 92,48" fill="#fff" stroke="#0002" stroke-width="2" stroke-linejoin="round"/><polygon points="166,86 170,8 108,48" fill="#fff" stroke="#0002" stroke-width="2" stroke-linejoin="round"/>
<polygon points="42,70 40,26 76,50" fill="#F4B1B8"/><polygon points="158,70 160,26 124,50" fill="#F4B1B8"/></svg>
<div class="pic" style="background-image:url('${photo}')"></div><svg class="face" viewBox="0 0 200 216" aria-hidden="true">${marks}</svg></div>`;
}

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return s}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){try{const t={...S,photo:null};localStorage.setItem(KEY,JSON.stringify(t))}catch(_){}}}

const P = () => S.gender==='f' ? '她' : '他';
const N = () => S.name || '小貓';
const fill = t => t.replace(/\{n\}/g, N()).replace(/\{p\}/g, P());
const add = (k, d) => { S.stats[k] = clamp(S.stats[k] + d, 0, 100); };
const stage = (m = S.ageM) => m < 12 ? 'kitten' : m < 120 ? 'adult' : 'senior';
const stageName = m => m < 12 ? '幼貓' : m < 84 ? '成貓' : m < 132 ? '熟齡貓' : '老貓';
const ageLabel = m => m < 12 ? `${m} 個月` : `${Math.floor(m/12)} 歲${m%12>=6?'半':''}`;
function humanAge(m){ if(m<=12) return [0,1,3,4,6,8,10,11,12,13,14,14,15][m]; const y=m/12; return y<2 ? Math.round(15+(y-1)*9) : Math.round(24+(y-2)*4); }
function mem(text){ S.memories.push({ageM:S.ageM, text:fill(text)}); }

$('#photoInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      // square-crop and shrink so it fits in local storage
      const s = Math.min(img.width, img.height), cv = document.createElement('canvas'); cv.width = cv.height = 360;
      cv.getContext('2d').drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 360, 360);
      S.photo = cv.toDataURL('image/jpeg', .82); save(); render();
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
});

function setExpr(e, ms = 1600){ expr = e; refreshCat(); clearTimeout(exprTimer); exprTimer = setTimeout(() => { expr = S.sick ? 'sad' : 'normal'; refreshCat(); }, ms); }
function anim(cls){ const cw = $('#cw'); if(!cw) return; cw.classList.remove('hop','wiggle','shrink'); void cw.offsetWidth; cw.classList.add(cls); }
function floatFx(txt, x, y, color){
  const fx = $('#fx'); if(!fx) return;
  const el = document.createElement('div'); el.className = 'float'; el.textContent = txt;
  el.style.left = x + 'px'; el.style.top = y + 'px'; if(color) el.style.color = color;
  fx.appendChild(el); setTimeout(() => el.remove(), 1500);
}
function fxAtCat(txt, color){
  const room = $('#room'), cw = $('#cw'); if(!room||!cw) return;
  const r = room.getBoundingClientRect(), c = cw.getBoundingClientRect();
  floatFx(txt, c.left - r.left + c.width*(.25+Math.random()*.5), c.top - r.top + c.height*.2, color);
}
function sleepZ(){
  const fx = $('#fx'), cw = $('#cw'), room = $('#room'); if(!fx||!cw) return;
  const r = room.getBoundingClientRect(), c = cw.getBoundingClientRect();
  for(let i=0;i<3;i++){ const z = document.createElement('div'); z.className='zzz'; z.textContent='z'; z.style.left=(c.right-r.left-c.width*.2)+'px'; z.style.top=(c.top-r.top+c.height*.15)+'px'; z.style.animationDelay=(i*.85)+'s'; fx.appendChild(z); }
}

function idleLine(){

  const low = Object.entries({full:s.full,mood:s.mood,clean:s.clean,health:s.health}).sort((a,b)=>a[1]-b[1])[0];
  if(low[1] < 25) return {full:'喵嗚——！（碗空了！）', mood:'（尾巴甩來甩去，好無聊）', clean:'（看著貓砂盆，一臉嫌棄）', health:'（窩在角落，不太想動）'}[low[0]];
  if(s.bond > 60 && Math.random() < .25) return '（對你慢慢眨眼——這是貓在說我愛你）';
  const lines = {
    kitten:['咪！','咪～咪～','（追著自己的尾巴轉圈）','（咬你的拖鞋）','（爬窗簾爬到一半下不來）','（打了一個小小的噴嚏）','（四腳朝天露出肚子……是陷阱嗎？）'],
    adult:['喵～','（瞇著眼睛看你）','喵嗯？','（理毛理到一半，舌頭忘了收）','（盯著空氣裡什麼都沒有的地方）','（把頭塞進你的手掌）','（翻肚肚）','（在你腳邊繞八字）'],
    senior:['（打了一個大大的哈欠）','喵……','（在最暖的地方睡著了）','（慢慢走過來，靠著你坐下）','（呼嚕呼嚕）'],
  }[st];
  return pick(lines);
}

function petCat(e){
  const now = Date.now();

  const cw = $('#cw'), rect = cw.getBoundingClientRect();
  const y = e && e.clientY ? (e.clientY - rect.top) / rect.height : .3;
  const belly = y > .62;
  S.counts.pet++;
  if(S.stats.bond < 12 && Math.random() < .35){ setExpr('sad'); anim('shrink'); say('（往後縮了一下，還有點怕你）'); narr('慢慢來，' + N() + ' 還在認識你。'); add('bond',1); save(); return; }
  if(recentPets.length > 6){ S.counts.bite++; setExpr('angry'); anim('wiggle'); say('哈——！（夠了！）'); narr(fill('{n} 咬了你一口，跳開去舔毛。貓的耐心是有額度的。')); fxAtCat('💢','#E7756A'); recentPets = []; add('mood',-3); save(); return; }
  if(belly && Math.random() < (S.stats.bond > 80 ? .15 : .4)){ S.counts.bite++; setExpr('angry'); anim('wiggle'); say('（抱住你的手，連咬帶踢）'); narr('你摸了肚肚。你明知道那是陷阱的。'); fxAtCat('💢','#E7756A'); save(); return; }
  setExpr('happy');
  anim('shrink');
  fxAtCat(Math.random()<.3 ? '呼嚕' : '♥');
  add('mood', 3);
  if(S.bondFromPets < 6){ add('bond',1); S.bondFromPets++; }
  S.petsToday++;
  say(pick(belly ? ['（翻過來讓你摸肚肚）','呼嚕呼嚕呼嚕……'] : y < .35 ? ['（瞇起眼睛，用頭頂你的手）','呼嚕呼嚕……','（下巴抬高，這邊這邊）'] : ['（尾巴翹得高高的）','喵～','（背拱起來蹭你）']));
  save(); updateStats();
}
function updateStats(){
  const box = app.querySelector('.stats'); if(!box) return;
  box.innerHTML = `${statRow('full','飽足')}${statRow('mood','心情')}${statRow('clean','清潔')}${statRow('health','健康')}${statRow('bond','親密')}`;
}

/* ---------- actions ---------- */
function act(a){
  if(a==='feed') return feedMenu();
  if(a==='sleep') return endDay();
  const st = stage();
  if(a==='play'){
    if(S.sick || S.stats.health < 25){ narr(fill('{n} 看了逗貓棒一眼，又把頭埋回去。{p}今天沒力氣。')); return spend(); }
    add('mood', st==='kitten'?22:st==='senior'?10:18); add('full', st==='senior'?-4:-8); add('clean',-4); add('bond',2); S.counts.play++;
    anim('hop'); setExpr('happy', 1400); fxAtCat('🪶');
    narr(pick(st==='senior' ? ['{n} 躺著用一隻手撥逗貓棒，意思意思一下。','{n} 盯著羽毛看了很久，最後撲了一次。很帥。']
      : ['{n} 屁股扭扭扭——撲！整隻飛起來。','{n} 追著逗貓棒在客廳翻了三圈，撞到沙發。','{n} 抓到羽毛後死咬不放，後腳還一直踢。','玩到一半，{n} 突然覺得紙箱比較好玩。']).replace(/\{n\}/g,N()));
  } else if(a==='brush'){
    add('clean',22); add('bond',3); S.counts.brush++;
    if(Math.random()<.2){ add('mood',-4); setExpr('angry'); anim('wiggle'); narr(fill('梳到尾巴時，{n} 回頭咬了梳子。{p}今天不想梳。')); }
    else { add('mood',4); setExpr('happy'); fxAtCat('✨','#F2B53B'); narr(fill(pick(['梳下來一大團毛，夠再做一隻小貓了。','{n} 舒服到開始流口水。','{n} 把臉湊過來，臉頰也要梳。']))); }
  } else if(a==='litter'){
    add('clean',30); add('health',2);
    narr(fill(pick(['你鏟完貓砂，{n} 立刻跑進去上了一個新的。','鏟屎官，今天也辛苦了。','{n} 在旁邊監工，確認你有鏟乾淨。'])));
  } else if(a==='vet'){
    S.counts.vet++; add('health',25); add('mood',-14);
    if(S.sick){ S.sick=false; narr(fill('醫生幫 {n} 打了針、開了藥。回家路上{p}在提籠裡罵了一路，但精神好多了。')); mem('{p}生病了，你帶{p}去看醫生，{p}很勇敢'); }
    else narr(fill(pick(['醫生說 {n} 很健康。{p}在診間發出低吼，然後被量肛溫。','{n} 一看到提籠就躲進床底下，花了二十分鐘才抓到。'])));
    setExpr('sad', 2500);
  }
  spend();
}
function feedMenu(){
  modal(`<div class="kicker">${SLOTS[S.slot]} · 開飯</div><h2>要吃什麼？</h2>
  <div class="opts">
    <button class="opt" data-f="dry">乾乾<small>飽足 +35，營養均衡</small></button>
    <button class="opt" data-f="wet">罐罐<small>飽足 +30，心情 +8，聽到開罐聲就跑來了</small></button>
    <button class="opt" data-f="treat">肉泥<small>心情 +16，零食不能多吃喔</small></button>
  </div><button class="opt" data-f="x" style="text-align:center;background:none">先不要</button>`, root => {
    root.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
      const f = b.dataset.f; closeModal(); if(f==='x') return;
      S.counts.meal++;
      if(f==='dry'){ add('full',35); add('health',2); narr(fill(pick(['{n} 喀滋喀滋地吃乾乾，吃完還檢查一下碗底。','{n} 吃了兩口，抬頭看你：就這樣？']))); fxAtCat('🍚'); }
      if(f==='wet'){ add('full',30); add('mood',8); add('health',3); narr(fill(pick(['開罐聲一響，{n} 從家裡另一頭衝過來。','{n} 吃得臉都埋進碗裡，發出嗯嗯嗯的聲音。']))); fxAtCat('🐟'); }
      if(f==='treat'){ add('full',8); add('mood',16); S.treatsToday++; if(S.treatsToday>1) add('health',-5); narr(fill(S.treatsToday>1?'{n} 又吃了一條肉泥。很開心，但零食吃太多對身體不好喔。':'{n} 抱著你的手猛舔肉泥，舌頭刮得你好癢。')); fxAtCat('♥'); }
      if(S.stats.full >= 100 && f!=='treat') narr(fill('{n} 吃太飽了，把剩下的用空氣撥沙埋起來。'));
      anim('hop'); setExpr('happy');
      spend();
    });
  });
}
function spend(){
  updateStats();
  S.slot++;
  save();
  if(S.slot >= SLOTS.length) return setTimeout(endDay, 900);
  const room = $('#room'); if(room){ room.className = 'room t' + S.slot; }
  const chip = app.querySelector('.chip.amber'); if(chip) chip.textContent = SLOTS[S.slot];
  updateStats();
}

/* ---------- day cycle ---------- */
function endDay(){
  const room = $('#room'); if(room) room.className = 'room t3';
  const st = S.stats;
  // overnight needs
  add('full', -26); add('mood', -10); add('clean', -14);
  let dh = 0;
  if(st.full < 20) dh -= 10; if(st.clean < 20) dh -= 6; if(st.mood < 20) dh -= 4;
  if(st.full > 50 && st.clean > 50 && st.mood > 50) dh += 4;
  if(S.sick) dh -= 10;
  if(stage() === 'senior') dh -= 3;
  add('health', dh);
  // care nudges lifespan a little either way
  if(st.health < 25) S.lifespanM -= 3;
  if(st.full > 60 && st.mood > 60 && st.clean > 60 && st.health > 60) S.lifespanM += 1;
  S.lifespanM = clamp(S.lifespanM, Math.max(S.ageM + 6, 120), 252);
  // age
  const prev = S.ageM;
  S.ageM += S.ageM < 6 ? 1 : S.ageM < 12 ? 2 : 6;
  S.day++; S.slot = 0; S.petsToday = 0; S.treatsToday = 0; S.bondFromPets = 0;
  if(S.ageM >= 12 && Math.floor(S.ageM/12) > Math.floor(prev/12) && S.ageM > 12) { add('mood', 6); }
  if(Math.random() < .08 + (stage()==='senior'?.08:0) && !S.sick && S.ageM > 12) { S.sick = true; add('health', -12); }
  expr = S.sick ? 'sad' : 'normal';
  save();
  // night overlay then morning
  modal(`<div class="kicker">晚安</div><h2>${esc(N())}，晚安</h2><p>${fill(pick(['{n} 窩在你腳邊睡著了。','{n} 擠進你的被窩，只露出一顆頭。','{n} 在你枕頭旁邊捲成一團。']))}</p>`, null, true);
  setTimeout(() => { closeModal(); morning(prev); }, 1500);
}
function morning(prevAge){
  if(S.ageM >= S.lifespanM){ S.phase = 'farewell'; S.narr = fill(`{n} ${ageLabel(S.ageM)}了。今天從早上就一直睡，叫{p}的名字，尾巴尖輕輕動了一下。呼吸變得好輕、好輕。`); save(); render(); return; }
  const queue = [];
  for(const m of MILESTONES) if(prevAge < m.at && S.ageM >= m.at && !S.flags['m'+m.at]){ S.flags['m'+m.at] = 1; queue.push(m.ev); }
  const yrs = Math.floor(S.ageM/12);
  if(S.ageM >= 24 && yrs > Math.floor(prevAge/12)) queue.push({title:`${yrs} 歲生日`, text:`今天是 {n} 的 ${yrs} 歲生日。`, choices:[{label:'開罐罐慶祝', fx:()=>{add('mood',10);add('full',15);if(yrs%5===0) mem('你幫{p}過生日，你吃蛋糕，{p}吃罐罐');return '{n} 吃完，在你腳邊打了一個滿足的嗝。';}}]});
  // one night behaviour, one daytime event — not every day
  if(Math.random() < .5){ const ev = pickEvent(NIGHT); if(ev) queue.push(ev); }
  if(Math.random() < .55){ const ev = pickEvent(EVENTS); if(ev) queue.push(ev); }
  S.narr = fill(pick(stage()==='senior' ? ['早安。{n} 比你晚起，慢慢伸了一個懶腰。','陽光照到床上，{n} 還在睡。'] : ['早安！{n} 已經坐在碗旁邊等你了。','你被 {n} 踩醒了，新的一天。','早上，{n} 在窗邊看鳥。']));
  save(); render();
  runQueue(queue);
}
function pickEvent(list){
  const ok = list.filter(e => S.ageM >= (e.min||0) && (e.repeat || !S.seen[e.id]) && !(e.id==='sick' && S.sick));
  if(!ok.length) return null;
  const unseen = ok.filter(e => !S.seen[e.id]);
  const ev = pick(unseen.length && Math.random() < .8 ? unseen : ok);
  S.seen[ev.id] = (S.seen[ev.id]||0) + 1;
  return ev;
}
function runQueue(q){
  if(!q.length){ save(); render(); return; }
  const ev = q.shift();
  showEvent(ev, () => runQueue(q));
}
function showEvent(ev, done){
  modal(`<div class="kicker">${ageLabel(S.ageM)} · ${stageName(S.ageM)}</div><h2>${esc(fill(ev.title))}</h2><p>${esc(fill(ev.text))}</p>
    <div class="opts">${ev.choices.map((c,i)=>`<button class="opt" data-i="${i}">${esc(fill(c.label))}${c.hint?`<small>${esc(fill(c.hint))}</small>`:''}</button>`).join('')}</div>`, root => {
    root.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
      const r = ev.choices[+b.dataset.i].fx();
      save();
      if(r && typeof r === 'object' && r.next){ closeModal(); return showEvent({...r.next, text: (r.text ? r.text + '\n' : '') + r.next.text}, done); }
      root.querySelector('.opts').outerHTML = `<p class="res">${esc(fill(r||''))}</p><div class="opts"><button class="opt" id="okb" style="text-align:center">好</button></div>`;
      $('#okb').focus();
      $('#okb').onclick = () => { closeModal(); done(); };
    });
  });
}

/* ---------- farewell & ending ---------- */
let fPets = 0;
function farewellPet(){
  fPets++;
  const ms = S.memories.slice(1);
  const m = ms.length ? ms[(ms.length - fPets % ms.length) % ms.length] : null;
  fxAtCat('♥');
  narr(m ? `你想起 ${ageLabel(m.ageM)} 的時候，${m.text}。` : fill('{n} 的毛還是一樣軟。'));
  if(fPets === 3) say('（尾巴輕輕地，勾住了你的手）');
}
function farewellHug(){
  const fh = $('#fhug'), fp = $('#fpet'); if(fh) fh.disabled = true; if(fp) fp.disabled = true;
  expr = 'normal'; refreshCat();
  say('喵……');
  narr(fill('{n} 睜開眼睛看著你，好像想起了那個下雨天。'));
  setTimeout(() => { say('謝謝你，陪我一生。'); }, 2600);
  setTimeout(() => { expr = 'sleep'; refreshCat(); say(''); narr(fill('{n} 在你懷裡，慢慢閉上了眼睛。')); }, 6200);
  setTimeout(() => { const r = $('#room'); if(r) r.classList.add('fadeout'); }, 8200);
  setTimeout(() => { S.phase = 'end'; save(); render(); }, 10600);
}
function letterText(){
  const pron = P(), ms = S.memories.slice(1), chosen = [];
  const pool = ms.slice();
  while(chosen.length < 3 && pool.length) chosen.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  chosen.sort((a,b)=>a.ageM-b.ageM);
  const b = S.stats.bond;
  const love = b >= 80 ? '每次你回家，我都會在門口等你，只是假裝剛好路過。'
    : b >= 50 ? '雖然我不常說，但你的腿是全世界最好睡的地方。' : '我是一隻不太會撒嬌的貓，但我一直都很喜歡你。';
  return `親愛的你：

還記得那個下雨天嗎？我在紙箱裡好冷，是你把我抱回家的。

` + (chosen.length ? chosen.map(m=>`我記得 ${ageLabel(m.ageM)} 的時候，${m.text.replace(new RegExp(pron,'g'),'我').replace(/你們/g,'我們')}。`).join('\n') + '\n\n' : '')
  + `你摸了我 ${S.counts.pet} 次，餵了我 ${S.counts.meal} 頓飯${S.counts.bite?`，我咬了你 ${S.counts.bite} 次（對不起，但你知道那是愛）`:''}。
${love}

我活了 ${ageLabel(S.ageM)}，每一天都很幸福。
我先去彩虹橋那邊曬太陽了。不要太難過，偶爾想起我就好。
如果哪天你在路邊看到一個紙箱，記得蹲下來看看。

謝謝你，陪我一生。

—— 永遠是你的 ${N()}`;
}
function renderEnd(){
  if(!S.letter){ S.letter = letterText(); save(); }
  const yrs = Math.floor(S.ageM/12);
  app.innerHTML = `
  <header class="top"><div><h1>${esc(N())}</h1><div class="sub">${COAT[S.coatId].name} · 享年 ${ageLabel(S.ageM)}</div></div></header>
  <section class="sky"><div class="stars"></div><div class="bow"></div><div class="soul">${S.photo?photoCat(S.photo,'adult','happy'):catSVG(S.coatId,S.seed,'adult','happy',60)}</div></section>
  <div class="letter" id="letter"><span class="cur"></span></div>
  <section class="summary">
    <div><b>${yrs}</b><span>一起的年</span></div><div><b>${S.counts.pet}</b><span>摸摸</span></div>
    <div><b>${S.counts.meal}</b><span>頓飯</span></div><div><b>${S.memories.length}</b><span>個回憶</span></div></section>
  <div class="btnrow"><button class="btn" id="album">看回憶相簿</button><button class="btn primary" id="again">再去巷口看看</button></div>`;
  $('#album').onclick = showAlbum;
  $('#again').onclick = () => { S = fresh(); save(); render(); };
  typeLetter(S.letter);
}
function typeLetter(txt){
  const el = $('#letter'); let i = 0;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce || S.letterShown){ el.textContent = txt; return; }
  const tick = () => {
    if(!document.body.contains(el)) return;
    i += 1; el.innerHTML = esc(txt.slice(0,i)) + '<span class="cur"></span>';
    if(i < txt.length) setTimeout(tick, txt[i-1]==='\n' ? 260 : 55);
    else { S.letterShown = true; save(); }
  };
  el.onclick = () => { i = txt.length - 1; };
  tick();
}

/* ---------- modals ---------- */
function modal(html, bind, passive){
  const r = $('#modalRoot');
  r.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="card">${html}</div></div>`;
  if(!passive){ r.querySelector('.modal').onclick = e => { if(e.target.classList.contains('modal') && r.dataset.dismiss) closeModal(); }; }
  r.dataset.dismiss = '';
  if(bind) bind(r);
  const f = r.querySelector('button'); if(f) f.focus();
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
function showAlbum(){
  modal(`<div class="kicker">回憶相簿</div><h2>${esc(N())} 的一生</h2>
    ${S.memories.length ? `<div class="mem">${S.memories.map(m=>`<span class="a">${ageLabel(m.ageM)}</span><span class="x">${esc(m.text)}</span>`).join('')}</div>` : '<p>還沒有回憶。</p>'}
    <button class="opt" id="cl" style="text-align:center">關閉</button>`, r => { r.dataset.dismiss = '1'; $('#cl').onclick = closeModal; });
}
function photoMenu(){
  modal(`<div class="kicker">照片</div><h2>${esc(N())} 的樣子</h2><p>可以上傳你家貓咪的照片，或是用我們畫的${COAT[S.coatId].name}。</p>
    <div class="opts"><button class="opt" id="pu">上傳照片</button>${S.photo?'<button class="opt" id="pd">改回畫的貓</button>':''}<button class="opt" id="pc" style="text-align:center;background:none">取消</button></div>`, r => {
      r.dataset.dismiss = '1';
      $('#pu').onclick = () => { closeModal(); $('#photoInput').click(); };
      const pd = $('#pd'); if(pd) pd.onclick = () => { S.photo = null; save(); closeModal(); render(); };
      $('#pc').onclick = closeModal;
    });
}
function confirmRestart(){
  modal(`<div class="kicker">重新開始</div><h2>確定要重新開始嗎？</h2><p>${esc(N())} 的一生會被清掉，沒辦法復原。</p>
    <div class="opts"><button class="opt" id="no" style="text-align:center">不要，繼續陪${P()}</button><button class="opt" id="yes" style="text-align:center;color:#b5473d">重新開始</button></div>`, r => {
      r.dataset.dismiss = '1';
      $('#no').onclick = closeModal;
      $('#yes').onclick = () => { closeModal(); S = fresh(); save(); render(); };
    });
}

/* ---------- boot ---------- */
function start(data){
  S = (data && data.S && data.S.v === 1) ? data.S : (load() || fresh());
  if(S.phase === 'farewell') fPets = 0;
  render();
}
window.claude?.hot?.snapshot?.(() => ({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
